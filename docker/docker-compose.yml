name: data-khaos

# ============================================================
# Data Khaos - 一键启动编排（开发环境）
#
#   基础设施：MySQL 8、Redis 7、Nacos（standalone）
#   业务服务：网关 + 10 个微服务，共 11 个应用容器
#
#   启动：  cd docker && docker compose up -d --build
#   停止：  docker compose down
#   查看：  docker compose ps / docker compose logs -f <service>
#
#   说明：
#   - 服务默认连 MySQL（与 application.yml 默认一致）；生产使用达梦
#     DM8 时，把 MYSQL_HOST 相关环境变量替换为 DM8 连接即可。
#   - 应用容器未配置健康检查（镜像精简），依赖 infra 健康检查 +
#     restart: on-failure 自动拉起。
# ============================================================

x-app-common: &app-common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: on-failure
  networks:
    - dk-net
  environment: &app-env
    MYSQL_HOST: ${MYSQL_HOST:-mysql}
    MYSQL_PORT: ${MYSQL_PORT:-3306}
    MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root123456}
    NACOS_ADDR: ${NACOS_ADDR:-nacos:8848}
    REDIS_HOST: ${REDIS_HOST:-redis}
    REDIS_PORT: ${REDIS_PORT:-6379}
    REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    JWT_SECRET: ${JWT_SECRET:-data-khaos-jwt-secret-key-2026-hs256-0123456789}
    JWT_EXPIRE_SECONDS: ${JWT_EXPIRE_SECONDS:-7200}
    AES_KEY: ${AES_KEY:-data-khaos-aes-2026}
    CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    nacos:
      condition: service_started

services:
  # ---------- 基础设施 ----------
  mysql:
    image: mysql:8.0
    container_name: dk-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root123456}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../db/mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - dk-net

  redis:
    image: redis:7-alpine
    container_name: dk-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - dk-net

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: dk-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"   # Nacos 2.x gRPC 端口（服务发现必需）
    volumes:
      - nacos-data:/home/nacos/data
    restart: unless-stopped
    networks:
      - dk-net

  # ---------- API 网关 ----------
  gateway:
    <<: *app-common
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: data-khaos-gateway
    container_name: dk-gateway
    ports:
      - "8099:8080"   # 主机 8099 -> 容器内 8080；让出 8080 供其他服务使用

  # ---------- 认证中心 ----------
  auth:
    <<: *app-common
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: data-khaos-auth
    container_name: dk-auth
    ports:
      - "8081:8081"

  # ---------- 权限系统 ----------
  permission:
    <<: *app-common
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: data-khaos-permission
    container_name: dk-permission
    ports:
      - "8082:8082"

  # ---------- 权限审批 ----------
  approval:
    <<: *app-common
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: data-khaos-approval
    container_name: dk-approval
    ports:
      - "8083:8083"

  # ---------- 数据源接入 ----------
  datasource:
    <<: *app-common
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: data-khaos-datasource
    container_name: dk-datasource
    ports:
      - "8084:8084"

  # ---------- 元数据中心 ----------
  metadata:
    <<: *app-common
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: data-khaos-metadata
    container_name: dk-metadata
    ports:
      - "8085:8085"

  # ---------- 数据集市 ----------
  mart:
    <<: *app-common
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: data-khaos-mart
    container_name: dk-mart
    ports:
      - "8086:8086"

  # ---------- SQL 查询平台 ----------
  query:
    <<: *app-common
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: data-khaos-query
    container_name: dk-query
    ports:
      - "8087:8087"

  # ---------- 可视化引擎 ----------
  visual:
    <<: *app-common
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: data-khaos-visual
    container_name: dk-visual
    ports:
      - "8088:8088"

  # ---------- 调度系统 ----------
  schedule:
    <<: *app-common
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: data-khaos-schedule
    container_name: dk-schedule
    ports:
      - "8089:8089"

  # ---------- 推送系统 ----------
  notification:
    <<: *app-common
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: data-khaos-notification
    container_name: dk-notification
    ports:
      - "8090:8090"

  # ---------- 数据质量 ----------
  dquality:
    <<: *app-common
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: data-khaos-dquality
    container_name: dk-dquality
    ports:
      - "8091:8091"

  # ---------- 数据管道 ----------
  pipeline:
    <<: *app-common
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: data-khaos-pipeline
    container_name: dk-pipeline
    ports:
      - "8092:8092"

  # ---------- HDFS（复用 apache/hive 镜像内的 Hadoop 3.3.6，arm64 原生） ----------
  # 单节点 HDFS：namenode + datanode。供 Hive warehouse 与 DataX hdfsreader/hdfswriter 使用。
  hdfs-namenode:
    image: apache/hive:4.0.0
    container_name: dk-hdfs-namenode
    user: "1000:1000"
    entrypoint: sh
    command:
      - -c
      - |
        /opt/hadoop/bin/hdfs namenode -format -force -nonInteractive ||
        /opt/hadoop/bin/hdfs namenode -format -nonInteractive 2>/dev/null || true
        /opt/hadoop/bin/hdfs namenode
    environment:
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /etc/hdfs-conf
      HADOOP_HEAPSIZE: "512"          # 压小 NameNode 堆，避免挤占 Hive 内存
      HADOOP_NAMENODE_OPTS: "-Xmx512m -Xms256m"
      HADOOP_OPTS: "-Xmx512m"
    volumes:
      - ./hdfs-conf:/etc/hdfs-conf:ro
      - hdfs-namenode:/hadoop/dfs/name
      - hdfs-tmp:/hadoop/tmp
    ports:
      - "9870:9870"    # NameNode HTTP UI
      - "9000:9000"    # NameNode RPC
    healthcheck:
      test: ["CMD", "sh", "-c", "/opt/hadoop/bin/hdfs dfsadmin -report >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 20s
      retries: 30
      start_period: 40s
    restart: unless-stopped
    networks:
      - dk-net

  hdfs-datanode:
    image: apache/hive:4.0.0
    container_name: dk-hdfs-datanode
    user: "1000:1000"
    entrypoint: sh
    command:
      - -c
      - |
        /opt/hadoop/bin/hdfs datanode
    environment:
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /etc/hdfs-conf
      HADOOP_HEAPSIZE: "512"          # 压小 DataNode 堆
      HADOOP_CLIENT_OPTS: "-Xmx256m"
      HADOOP_DATANODE_OPTS: "-Xmx512m -Xms256m"
      HADOOP_OPTS: "-Xmx512m"
    volumes:
      - ./hdfs-conf:/etc/hdfs-conf:ro
      - hdfs-datanode:/hadoop/dfs/data
      - hdfs-tmp:/hadoop/tmp
    depends_on:
      hdfs-namenode:
        condition: service_started
    restart: unless-stopped
    networks:
      - dk-net

  # ---------- Hive 数仓（Apache Hive 4.0，warehouse 落 HDFS） ----------
  # 复用 apache/hive 镜像内的 Hadoop 3.3.6 连接 HDFS，warehouse 存于 hdfs://hdfs-namenode:9000。
  # HiveServer2 仍暴露 10000 端口，供数据源接入 / 数据管道任务访问（JDBC 路径不变，
  # 因此 DB-Sync 等其它插件不受影响）。
  hive:
    image: apache/hive:4.0.0
    container_name: dk-hive
    entrypoint: sh
    command:
      - -c
      - |
        echo "hdfs" && nc -z hdfs-namenode 9000
        # 清理上次异常退出残留的 PID 锁，避免"HiveServer2 running as process"导致的重启循环
        rm -f /opt/hive/conf/hiveserver2.pid
        /entrypoint.sh
    environment:
      SERVICE_NAME: hiveserver2
      DB_DRIVER: derby
      IS_RESUME: "false"
      HIVE_SERVER2_THRIFT_PORT: "10000"
      HIVE_SERVER2_THRIFT_BIND_HOST: 0.0.0.0
      HADOOP_HOME: /opt/hadoop
      HIVE_CUSTOM_CONF_DIR: /etc/hive-conf
      HADOOP_HEAPSIZE: "768"
      HADOOP_OPTS: "-Xmx768m -Xms256m"
      HADOOP_CLIENT_OPTS: "-Xmx512m"
      HADOOP_DATANODE_OPTS: "-Xmx256m"
      TZ: Asia/Shanghai
    mem_limit: 1536m          # 容器内存上限，避免 JVM 申请超 VM 剩余导致被 OOM 击杀
    mem_reservation: 512m
    ports:
      - "10000:10000"
    volumes:
      - hive-metastore:/opt/hive/meta_data
      - ./hdfs-conf:/etc/hive-conf:ro
    depends_on:
      hdfs-namenode:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "-c", "beeline -u 'jdbc:hive2://127.0.0.1:10000/default' -e 'select 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 20s
      retries: 30
      start_period: 90s
    restart: unless-stopped
    networks:
      - dk-net

volumes:
  hive-metastore:
  hdfs-conf:
  hdfs-namenode:
  hdfs-datanode:
  hdfs-tmp:
  mysql-data:
  redis-data:
  nacos-data:

networks:
  dk-net:
    driver: bridge
